name: CI

# Quality gate (lint + format + testes). NÃO faz build/deploy: o GitHub Pages
# já serve os arquivos da branch main diretamente (raiz do repo), sem bundler.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
